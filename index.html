<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมทายคำศัพท์ภาษาอังกฤษ Anagram ป.3 (มีปุ่มข้าม)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: #f7f3ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(108, 92, 231, 0.15); width: 100%; max-width: 500px; text-align: center; border: 4px solid #fff; position: relative; }
        h1 { color: #6c5ce7; margin-top: 0; font-size: 1.8rem; margin-bottom: 5px; }
        .sub-title { color: #a29bfe; font-size: 0.9rem; margin-bottom: 20px; }
        
        .category-card { background: #f8f9fe; border: 2px dashed #a29bfe; border-radius: 15px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .category-card label { display: block; font-weight: 600; color: #5f27cd; margin-bottom: 8px; font-size: 0.95rem; }
        select { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #a29bfe; font-size: 1rem; outline: none; background: white; cursor: pointer; color: #6c5ce7; font-weight: 600; }
        
        .score-board { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: bold; margin-bottom: 15px; background: #eeebff; padding: 10px 15px; border-radius: 12px; color: #5f27cd; }
        
        .img-container { width: 100%; height: 200px; border-radius: 15px; overflow: hidden; background: #f1f2f6; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; border: 2px solid #dfe4ea; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 13px; }
        .emoji-fallback { font-size: 5rem; display: none; }

        .scrambled-word { font-size: 2.2rem; letter-spacing: 5px; font-weight: 800; color: #ff9f43; margin: 15px 0; background: #fff3e0; padding: 10px; border-radius: 12px; word-break: break-all; }
        
        input[type="text"] { width: 100%; padding: 12px; font-size: 1.3rem; border-radius: 12px; border: 2px solid #ccc; text-align: center; text-transform: lowercase; margin-bottom: 12px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #6c5ce7; box-shadow: 0 0 10px rgba(108, 92, 231, 0.2); }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; background: #6c5ce7; transition: 0.2s; box-shadow: 0 4px 0 #5f27cd; }
        .btn:hover { background: #5f27cd; transform: translateY(-1px); }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5f27cd; }
        
        .btn-skip { background: #ff9f43; box-shadow: 0 4px 0 #e67e22; }
        .btn-skip:hover { background: #e67e22; }
        .btn-skip:active { box-shadow: 0 1px 0 #e67e22; }

        .btn-outline { background: transparent; color: #6c5ce7; border: 2px solid #6c5ce7; box-shadow: none; font-size: 0.95rem; padding: 8px; margin-top: 5px; }
        .btn-outline:hover { background: #eeebff; transform: none; }

        .feedback { font-size: 1.1rem; font-weight: bold; margin-top: 10px; min-height: 25px; }
        .correct { color: #10ac84; animation: pop 0.5s ease-in-out; }
        .wrong { color: #ee5253; animation: shake 0.4s ease-in-out; }
        .skipped { color: #ff9f43; }

        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
    <h1>🧩 Kids Anagram Game</h1>
    <div class="sub-title">(เกมทายคำศัพท์ภาษาอังกฤษสำหรับเด็ก ป.3)</div>

    <!-- หน้าที่ 1: เลือกหมวดหมู่ -->
    <div id="selection-screen">
        <div class="category-card">
            <label for="category-select">เลือกหมวดหมู่ที่ต้องการเล่น:</label>
            <select id="category-select">
                <option value="all">🌟 ทุกหมวดหมู่ (สุ่มรวมทุกคำ)</option>
                <option value="numbers">🔢 Number words (คำศัพท์ตัวเลข)</option>
                <option value="fruits">🍎 Fruits (ผลไม้)</option>
                <option value="verbs">🏃 Action Verbs (กริยาอาการ)</option>
                <option value="family">👨‍👩‍👧‍👦 Family (ครอบครัว)</option>
                <option value="places">🏫 Places (สถานที่)</option>
                <option value="school">✏️ School Things (อุปกรณ์การเรียน)</option>
            </select>
        </div>
        <button class="btn" onclick="startGame()">🚀 เริ่มเล่นเกมเลย!</button>
    </div>

    <!-- หน้าที่ 2: หน้าเล่นเกม -->
    <div id="game-screen" style="display: none;">
        <div class="score-board">
            <span>หมวด: <span id="current-cat-name">ทุกหมวด</span></span>
            <span>เหลือ: <span id="remaining-count">0</span> คำ</span>
            <span>คะแนน: <span id="score">0</span></span>
        </div>

        <div class="img-container">
            <img id="word-image" src="" alt="คำใบ้รูปภาพ" onerror="handleImageError()">
            <div id="emoji-fallback" class="emoji-fallback"></div>
        </div>

        <div class="scrambled-word" id="scrambled-text">...</div>

        <form id="game-form" onsubmit="checkAnswer(event)">
            <input type="text" id="user-input" placeholder="พิมพ์คำตอบภาษาอังกฤษ..." autocomplete="off">
            <div class="btn-group">
                <button type="submit" class="btn">✓ ส่งคำตอบ</button>
                <button type="button" class="btn btn-skip" onclick="skipQuestion()">⏩ ข้ามไปก่อน</button>
            </div>
        </form>

        <button type="button" class="btn btn-outline" onclick="resetToMenu()">⚙️ เปลี่ยนหมวดหมู่</button>

        <div class="feedback" id="feedback-text"></div>
    </div>
</div>

let currentCategoryKey = 'all';
let activeWordsObj = {};
let availableWords = [];
let currentWord = '';
let score = 0;

function startGame() {
    currentCategoryKey = document.getElementById('category-select').value;
    
    if (currentCategoryKey === 'all') {
        activeWordsObj = {};
        for (let key in database) {
            Object.assign(activeWordsObj, database[key].words);
        }
        document.getElementById('current-cat-name').innerText = 'ทุกหมวดหมู่';
    } else {
        activeWordsObj = database[currentCategoryKey].words;
        document.getElementById('current-cat-name').innerText = database[currentCategoryKey].name;
    }

    availableWords = Object.keys(activeWordsObj);

    document.getElementById('selection-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('game-form').style.display = 'block';
    
    score = 0;
    document.getElementById('score').innerText = score;
    loadNewQuestion();
}

function resetToMenu() {
    document.getElementById('selection-screen').style.display = 'block';
    document.getElementById('game-screen').style.display = 'none';
}

function scrambleWord(word) {
    let raw = word.replace(/\s+/g, '');
    let array = raw.split('');
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    let scrambled = array.join('');
    return (scrambled === raw && raw.length > 1) ? scrambleWord(word) : scrambled;
}

function loadNewQuestion() {
    if (availableWords.length === 0) {
        document.getElementById('scrambled-text').innerText = "🎉 WINNER!";
        document.getElementById('word-image').style.display = 'none';
        document.getElementById('emoji-fallback').style.display = 'block';
        document.getElementById('emoji-fallback').innerText = "🏆";
        document.getElementById('feedback-text').className = "feedback correct";
        document.getElementById('feedback-text').innerText = "เก่งมาก! เล่นครบทุกคำในหมวดนี้แล้วครับ";
        document.getElementById('game-form').style.display = 'none';
        document.getElementById('remaining-count').innerText = "0";
        return;
    }

    // หยิบคำแรกจากรายการมาเล่น
    currentWord = availableWords[0];

    document.getElementById('remaining-count').innerText = availableWords.length;

    const imgElement = document.getElementById('word-image');
    const fallbackElement = document.getElementById('emoji-fallback');
    
    imgElement.style.display = 'block';
    fallbackElement.style.display = 'none';
    
    imgElement.src = activeWordsObj[currentWord].img;
    fallbackElement.innerText = activeWordsObj[currentWord].emoji;

    document.getElementById('scrambled-text').innerText = scrambleWord(currentWord).toUpperCase();
    document.getElementById('user-input').value = '';
    document.getElementById('feedback-text').innerText = '';
    document.getElementById('user-input').focus();
}

function handleImageError() {
    document.getElementById('word-image').style.display = 'none';
    document.getElementById('emoji-fallback').style.display = 'block';
}

function checkAnswer(e) {
    e.preventDefault();
    const userInput = document.getElementById('user-input').value.trim().toLowerCase();
    const feedback = document.getElementById('feedback-text');

    if (userInput === currentWord.toLowerCase()) {
        score += 10;
        document.getElementById('score').innerText = score;
        feedback.className = "feedback correct";
        feedback.innerText = "🎉 ถูกต้องเก่งมาก!";
        
        // ลบคำที่ตอบถูกแล้วออกจากรายการ
        availableWords.shift();

        setTimeout(loadNewQuestion, 1200);
    } else {
        feedback.className = "feedback wrong";
        feedback.innerText = "❌ ยังไม่ถูก ลองใหม่อีกครั้ง!";
        document.getElementById('user-input').focus();
    }
}

function skipQuestion() {
    if (availableWords.length <= 1) {
        const feedback = document.getElementById('feedback-text');
        feedback.className = "feedback skipped";
        feedback.innerText = "💡 เหลือคำสุดท้ายแล้ว สู้ๆ ครับ!";
        return;
    }

    // ย้ายคำปัจจุบันไปไว้ท้ายสุดของ Array
    const skippedWord = availableWords.shift();
    availableWords.push(skippedWord);

    const feedback = document.getElementById('feedback-text');
    feedback.className = "feedback skipped";
    feedback.innerText = "⏩ ข้ามคำนี้ไปก่อน!";

    setTimeout(loadNewQuestion, 600);
}
