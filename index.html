<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid Anagram Game</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; text-align: center; background: #f0f8ff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, button { font-size: 16px; padding: 10px; margin: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .scrambled { font-size: 32px; letter-spacing: 5px; color: #ff6f61; font-weight: bold; margin: 20px 0; }
        input { font-size: 20px; padding: 8px; text-align: center; width: 70%; border-radius: 8px; border: 2px solid #4caf50; }
        #result { margin-top: 15px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧩 Kid Anagram Game 🧩</h2>
    <label for="category">เลือกหมวดหมู่:</label>
    <select id="category" onchange="nextQuestion()">
        <option value="Number words">Number words (20 คำ)</option>
        <option value="Fruits">Fruits (21 คำ)</option>
        <option value="Action Verbs">Action Verbs (20 คำ)</option>
        <option value="Family">Family (20 คำ)</option>
        <option value="Places">Places (20 คำ)</option>
        <option value="School Things">School Things (21 คำ)</option>
    </select>

    <div class="scrambled" id="scrambled-word">----</div>
    <input type="text" id="user-input" placeholder="พิมพ์คำตอบภาษาอังกฤษ" autocomplete="off">
    <br>
    <button onclick="checkAnswer()">ตรวจคำตอบ</button>
    <button onclick="nextQuestion()">คำถัดไป ➡️</button>

    <div id="result"></div>
</div>

<script>
// ชุดข้อมูลคำศัพท์อัปเดตล่าสุด
const vocabData = {
    "Number words": ["Zero", "Eleven", "Twelve", "Thirteen", "Twenty", "Forty", "Fifty", "Hundred", "Thousand", "Million", "Billion", "First", "Second", "Third", "Fourth", "Single", "Double", "Triple", "Quarter", "Half"],
    "Fruits": ["Cherry", "Plum", "Kiwi", "Papaya", "Avocado", "Coconut", "Pomegranate", "Watermelon", "Pineapple", "Mango", "Blueberry", "Lemon", "Lime", "Peach", "Apple", "Banana", "Orange", "Strawberry", "Grape", "Pears", "Dragon fruit"],
    "Action Verbs": ["Run", "Jump", "Walk", "Swim", "Read", "Write", "Speak", "Listen", "Eat", "Drink", "Cook", "Dance", "Sing", "Laugh", "Cry", "Build", "Think", "Drive", "Sleep", "Smile"],
    "Family": ["Mother", "Father", "Parents", "Son", "Daughter", "Brother", "Sister", "Grandmother", "Grandfather", "Grandparents", "Grandson", "Granddaughter", "Uncle", "Aunt", "Cousin", "Nephew", "Niece", "Husband", "Wife", "Sibling"],
    "Places": ["House", "School", "Hospital", "Market", "Park", "Library", "Bank", "Airport", "Station", "Restaurant", "Hotel", "Museum", "Beach", "Cinema", "Church", "Supermarket", "Bakery", "Pharmacy", "Gym", "Office"],
    "School Things": ["Pencil", "Pen", "Eraser", "Notebook", "Book", "Ruler", "Scissors", "Glue", "Backpack", "Desk", "Chair", "Whiteboard", "Marker", "Crayon", "Sharpener", "Calculator", "Computer", "Textbook", "Folder", "Compass", "chalk"]
};

let currentOriginalWord = "";

function shuffle(word) {
    let array = word.toLowerCase().split('');
    // หากมีช่องว่าง (เช่น Dragon fruit) ให้คงช่องว่างไว้แล้วสลับเฉพาะตัวอักษร
    for (let i = array.length - 1; i > 0; i--) {
        if (array[i] === ' ') continue;
        let j = Math.floor(Math.random() * (i + 1));
        if (array[j] === ' ') continue;
        [array[i], array[j]] = [array[j], array[i]];
    }
    let scrambled = array.join('');
    return (scrambled === word.toLowerCase() && word.length > 2) ? shuffle(word) : scrambled;
}

function nextQuestion() {
    const category = document.getElementById("category").value;
    const words = vocabData[category];
    currentOriginalWord = words[Math.floor(Math.random() * words.length)];
    
    document.getElementById("scrambled-word").innerText = shuffle(currentOriginalWord).toUpperCase();
    document.getElementById("user-input").value = "";
    document.getElementById("result").innerText = "";
    document.getElementById("user-input").focus();
}

function checkAnswer() {
    const userInput = document.getElementById("user-input").value.trim().toLowerCase();
    const resultDiv = document.getElementById("result");
    
    if (userInput === currentOriginalWord.toLowerCase()) {
        resultDiv.style.color = "green";
        resultDiv.innerText = "🎉 ถูกต้องครับ! (Correct!)";
    } else {
        resultDiv.style.color = "red";
        resultDiv.innerText = `❌ ยังไม่ถูกครับ ลองอีกที! (เฉลย: ${currentOriginalWord})`;
    }
}

// เริ่มต้นเกมคำแรก
nextQuestion();
</script>

</body>
</html>
