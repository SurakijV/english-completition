<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid Anagram Game for Grade 3</title>
    <!-- นำเข้า Canvas Confetti Library สำหรับสร้างเอฟเฟกต์พลุ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; text-align: center; background: #e0f7fa; padding: 15px; margin: 0; }
        .container { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); position: relative; }
        h2 { color: #0288d1; margin-top: 0; }
        
        .score-board { position: absolute; top: 15px; right: 20px; background: #fff59d; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #f57f17; font-size: 18px; border: 2px solid #fbc02d; }
        
        select, button { font-size: 16px; padding: 10px 15px; margin: 8px; border-radius: 12px; border: 2px solid #0288d1; background: white; cursor: pointer; font-weight: bold; }
        button { background: #4caf50; color: white; border: none; }
        button:hover { background: #45a049; }
        .btn-next { background: #ff9800; }
        .btn-next:hover { background: #f57c00; }
        .btn-speak { background: #0288d1; font-size: 18px; padding: 8px 12px; }
        .btn-restart { background: #e91e63; color: white; font-size: 18px; padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .btn-restart:hover { background: #c2185b; }
        
        .img-box { width: 220px; height: 180px; margin: 15px auto; border-radius: 15px; overflow: hidden; border: 4px solid #b2ebf2; display: flex; align-items: center; justify-content: center; background: #f1f8e9; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .fallback-emoji { font-size: 90px; line-height: 1; }
        
        .scrambled { font-size: 36px; letter-spacing: 6px; color: #e91e63; font-weight: bold; margin: 15px 0; background: #fce4ec; padding: 10px; border-radius: 10px; }
        input { font-size: 22px; padding: 10px; text-align: center; width: 75%; border-radius: 10px; border: 3px solid #0288d1; outline: none; }
        
        #result { margin-top: 15px; font-size: 20px; font-weight: bold; min-height: 40px; }
        .thai-read { font-size: 18px; color: #555; display: block; margin-top: 4px; }
        
        /* หน้าต่างสรุปผลคะแนนเมื่อจบเกม */
        .summary-card { background: #f3e5f5; border: 3px dashed #ab47bc; border-radius: 15px; padding: 25px; margin-top: 15px; }
        .summary-card h3 { color: #8e24aa; margin-top: 0; font-size: 26px; }
        .summary-score { font-size: 36px; color: #e91e63; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="score-board">⭐ คะแนน: <span id="score">0</span></div>

    <h2>🧩 Kid Anagram Game 🧩</h2>
    
    <div id="game-area">
        <label for="category">เลือกหมวดหมู่:</label>
        <select id="category" onchange="changeCategory()">
            <option value="Number words">Number words (20 คำ)</option>
            <option value="Fruits">Fruits (21 คำ)</option>
            <option value="Action Verbs">Action Verbs (20 คำ)</option>
            <option value="Family">Family (20 คำ)</option>
            <option value="Places">Places (20 คำ)</option>
            <option value="School Things">School Things (21 คำ)</option>
        </select>

        <div class="img-box" id="img-container"></div>

        <div class="scrambled" id="scrambled-word">----</div>
        <input type="text" id="user-input" placeholder="พิมพ์คำตอบภาษาอังกฤษ" autocomplete="off">
        <br>
        <button id="btn-check" onclick="checkAnswer()">ตรวจคำตอบ</button>
        <button class="btn-speak" onclick="speakWord()" title="ฟังเสียงอ่าน">🔊</button>
        <button class="btn-next" onclick="nextQuestion()">คำถัดไป ➡️</button>

        <div id="result"></div>
    </div>

    <!-- ส่วนสรุปผลเมื่อเล่นครบหมวด -->
    <div id="summary-area" class="summary-card" style="display: none;">
        <h3>🎉 ยินดีด้วย! เล่นครบทุกคำแล้ว 🎉</h3>
        <p style="font-size: 18px; margin: 5px 0;">คะแนนรวมที่คุณทำได้:</p>
        <div class="summary-score" id="final-score">0 คะแนน</div>
        <p id="total-words-info" style="color: #555; margin-bottom: 20px;"></p>
        <button class="btn-restart" onclick="restartCategory()">🔄 เล่นอีกครั้ง</button>
    </div>
</div>

        { word: "Grandparents", emoji: "👵👴", thai: "แกรนด์เพาเรนทส์" }, { word: "Grandson", emoji: "👦", thai: "แกรนด์ซัน" }, { word: "Granddaughter", emoji: "👧", thai: "แกรนด์ดอเทอร์" },

        { word: "Restaurant", emoji: "🍴", thai: "เรสเตอรองต์" }, { word: "Hotel", emoji: "🏨", thai: "โฮเทล" }, { word: "Museum", emoji: "🏛️", thai: "มิวเซียม" },
        { word: "Beach", emoji: "🏖️", thai: "บีช" }, { word: "Cinema", emoji: "🎬", thai: "ซิเนมา" }, { word: "Church", emoji: "⛪", thai: "เชิร์ช" },
        { word: "Supermarket", emoji: "🛒", thai: "ซูเปอร์มาร์เก็ต" }, { word: "Bakery", emoji: "🧁", thai: "เบเกอรี" }, { word: "Pharmacy", emoji: "💊", thai: "ฟาร์มาซี" },

    ],
    "School Things": [
        { word: "Pencil", emoji: "✏️", thai: "เพนซิล" }, { word: "Pen", emoji: "🖊️", thai: "เพน" }, { word: "Eraser", emoji: "🧹", thai: "อิเรเซอร์" },
        { word: "Notebook", emoji: "📓", thai: "โน้ตบุ๊ก" }, { word: "Book", emoji: "📕", thai: "บุ๊ก" }, { word: "Ruler", emoji: "📏", thai: "รูเลอร์" },
        { word: "Scissors", emoji: "✂️", thai: "สซิสเซอส์" }, { word: "Glue", emoji: "🧴", thai: "กรู" }, { word: "Backpack", emoji: "🎒", thai: "แบ็คแพ็ค" },

        { word: "Calculator", emoji: "🧮", thai: "แคลคูเลเตอร์" }, { word: "Computer", emoji: "💻", thai: "คอมพิวเตอร์" }, { word: "Textbook", emoji: "📘", thai: "เท็กซ์บุ๊ก" }, { word: "Folder", emoji: "📁", thai: "โฟลเดอร์" }, { word: "Compass", emoji: "🧭", thai: "คัมพัส" }, { word: "chalk", emoji: "🖍️", thai: "ชอล์ก" }
    ]
};

let currentPool = [];
let currentItem = null;
let score = 0;
let isAnswered = false;
let totalCategoryWords = 0;

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleWord(word) {
    let array = word.toLowerCase().split('');
    for (let i = array.length - 1; i > 0; i--) {
        if (array[i] === ' ') continue;
        let j = Math.floor(Math.random() * (i + 1));
        if (array[j] === ' ') continue;
        [array[i], array[j]] = [array[j], array[i]];
    }
    let scrambled = array.join('');
    return (scrambled === word.toLowerCase() && word.length > 2) ? shuffleWord(word) : scrambled;
}

function loadImage(term, fallbackEmoji) {
    const container = document.getElementById("img-container");
    container.innerHTML = `<span class="fallback-emoji">${fallbackEmoji}</span>`;

    const img = new Image();
    img.src = `https://source.unsplash.com/400x300/?cute,${encodeURIComponent(term)}`;
    img.alt = term;

    img.onload = function() {
        container.innerHTML = "";
        container.appendChild(img);
    };
}

function speakWord() {
    if (!currentItem) return;
    const utterance = new SpeechSynthesisUtterance(currentItem.word);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
}

function changeCategory() {
    score = 0;
    document.getElementById("score").innerText = score;
    currentPool = [];
    document.getElementById("summary-area").style.display = "none";
    document.getElementById("game-area").style.display = "block";
    nextQuestion();
}

function restartCategory() {
    changeCategory();
}

// ฟังก์ชันจุดพลุฉลอง
function triggerFireworks() {
    const duration = 3 * 1000;
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

    function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
            return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        // ยิงพลุจากฝั่งซ้ายและขวา
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
    }, 250);
}

function showSummary() {
    document.getElementById("game-area").style.display = "none";
    document.getElementById("summary-area").style.display = "block";
    document.getElementById("final-score").innerText = `${score} คะแนน`;
    const maxScore = totalCategoryWords * 10;
    document.getElementById("total-words-info").innerText = `(ทำได้ ${score / 10} จาก ${totalCategoryWords} คำ | คะแนนเต็ม ${maxScore} คะแนน)`;
    
    // เรียกใช้งานพลุเมื่อเปิดหน้าสรุป
    triggerFireworks();
}

function nextQuestion() {
    const category = document.getElementById("category").value;
    
    if (currentPool.length === 0) {
        totalCategoryWords = vocabDatabase[category].length;
        currentPool = shuffleArray(vocabDatabase[category]);
    }

    if (currentPool.length === 0) {
        showSummary();
        return;
    }
    
    currentItem = currentPool.pop();
    isAnswered = false;
    
    loadImage(currentItem.word, currentItem.emoji);

    document.getElementById("scrambled-word").innerText = shuffleWord(currentItem.word).toUpperCase();
    document.getElementById("user-input").value = "";
    document.getElementById("result").innerText = "";
    document.getElementById("user-input").focus();
}

function checkAnswer() {
    if (!currentItem) return;
    const userInput = document.getElementById("user-input").value.trim().toLowerCase();
    const resultDiv = document.getElementById("result");
    
    if (userInput === currentItem.word.toLowerCase()) {
        if (!isAnswered) {
            score += 10;
            document.getElementById("score").innerText = score;
            isAnswered = true;
        }
        resultDiv.style.color = "#2e7d32";
        resultDiv.innerHTML = `🎉 ถูกต้องครับ! <b>${currentItem.word}</b> <span class="thai-read">(คำอ่าน: ${currentItem.thai})</span>`;
        speakWord();
    } else {
        resultDiv.style.color = "#c62828";
        resultDiv.innerHTML = `❌ ยังไม่ถูกครับ <span class="thai-read">(เฉลย: <b>${currentItem.word}</b> - อ่านว่า: ${currentItem.thai})</span>`;
    }
}

// เริ่มต้นเกม
changeCategory();
</script>
